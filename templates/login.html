{% extends "base.html" %}
{% block title %}Log In · Budget Tracker{% endblock %}
{% block content %}
<section class="card">
  <h1>Log in</h1>
  <form method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email
      <input name="email" type="email" required>
    </label>
    <label>Password
      <input name="password" type="password" required>
    </label>
    <button type="submit">Log In</button>
  </form>
  <p class="muted">No account? <a href="{{ url_for('signup') }}">Sign up</a>.</p>
</section>
{% endblock %}
